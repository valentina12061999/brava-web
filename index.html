<style>
:root{
  --bg:#ffffff; --fg:#1b2b29; --muted:#55686a; --primary:#4C988C; --primary-fg:#ffffff; --ink:#3B776D;
  --hero:#F4F9F8; --mist:#E6F1EF; --card:#F1F7F6; --sage:#D4E6E3; --line:#C9E0DC;
  --dark:#192F2C; --dark-fg:#eef4f3; --leaf1:#B5D3CB; --leaf2:#D2E5E0; --logo:#4C988C;
  --serif:'Open Sans', 'Helvetica Neue', Arial, sans-serif;
  --sans:'Manrope', 'Helvetica Neue', Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141f23; --fg:#e9f0ef; --muted:#a9b9ba; --primary:#6FB8AC; --primary-fg:#0f1d1b; --ink:#8CCBC0;
    --hero:#14211F; --mist:#182826; --card:#192927; --sage:#1F3431; --line:#2E4744;
    --dark:#0f181b; --dark-fg:#eef4f3; --leaf1:#3d5249; --leaf2:#2f443e; --logo:#4C988C;
  }
}
:root[data-theme="dark"]{
  --bg:#141f23; --fg:#e9f0ef; --muted:#a9b9ba; --primary:#6FB8AC; --primary-fg:#0f1d1b; --ink:#8CCBC0;
  --hero:#14211F; --mist:#182826; --card:#192927; --sage:#1F3431; --line:#2E4744;
  --dark:#0f181b; --dark-fg:#eef4f3; --leaf1:#3d5249; --leaf2:#2f443e; --logo:#4C988C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(20px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:340;margin:0;letter-spacing:-0.03em}
em{font-weight:inherit}
em{font-style:italic}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(20px,5vw,72px)}
.label{font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);margin:0 0 40px}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:13px 22px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid var(--primary);cursor:pointer;font-family:var(--sans);transition:background .2s,color .2s}
.btn-solid{background:var(--primary);color:var(--primary-fg)}
.btn-solid:hover{filter:brightness(1.08)}
.btn-line{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn-line:hover{background:var(--fg);color:var(--bg)}
.btn svg{width:14px;height:14px}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}

/* header */
header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;background:transparent}
.nav{padding-top:8px}
.logo.icon .mark{width:38px;height:38px;display:block}
footer .logo.icon .mark{width:42px;height:42px}

.mobile{background:var(--bg);border-radius:16px;margin:6px 16px 0;box-shadow:0 18px 40px rgba(20,40,45,.12)}
.mobile a.btn{display:inline-flex;padding:13px 22px;font-size:12px;margin-top:12px}
.nav{display:flex;align-items:center;justify-content:space-between;height:86px;gap:20px}
.logo{display:inline-flex;color:var(--logo);text-decoration:none}
.logo .wm{height:54px;width:auto;display:block}
footer .logo .wm{height:56px}
.links{display:flex;gap:32px;font-size:13px;font-weight:500}
.links a{text-decoration:none}.links a:hover{color:var(--primary)}
.right{display:flex;align-items:center;gap:18px}
.lang{background:none;border:0;color:var(--fg);font:600 12px var(--sans);display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px}
.lang .on{font-weight:800}.lang .off{opacity:.55}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--fg);cursor:pointer}
.mobile{display:none;padding:14px 22px 20px}
.mobile a{display:block;padding:10px 0;text-decoration:none;font-size:16px}
.mobile.open{display:block}
@media(max-width:900px){.links,.right .btn,.right .lang{display:none}.menu-btn{display:inline-flex}}

@media(min-width:901px){.nav{position:relative}.nav .links{position:absolute;left:50%;transform:translateX(-50%)}}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero)}
.hero .wrap{position:relative;z-index:2;min-height:min(92vh,820px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:150px;padding-bottom:100px}
.hero h1{font-size:clamp(34px,4.6vw,70px);line-height:1.08;max-width:none}
.hero p.lead{max-width:540px;color:#24332F;font-size:17px;font-weight:400;margin:32px auto 32px}
.hero h1{color:#14231F}
.hero .label{color:#2F6158}
.ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.hero{background:#EBE4D9}
.hero-img{position:absolute;top:0;right:0;width:min(58%,980px);height:100%;object-fit:cover;object-position:right bottom;z-index:0;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 40%);mask-image:linear-gradient(90deg,transparent 0%,#000 40%)}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse 60% 70% at 50% 52%,rgba(245,241,235,.93) 0%,rgba(245,241,235,.8) 45%,rgba(245,241,235,.35) 75%,rgba(245,241,235,0) 100%);pointer-events:none}
@media(max-width:700px){.hero-img{width:100%;object-position:70% bottom;-webkit-mask-image:none;mask-image:none}.hero::after{background:rgba(245,241,235,.82)}}

/* generic sections */
section.block{padding:clamp(80px,11vw,140px) 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,7vw,100px)}
.head{display:block;margin-bottom:56px}
.head h2,.split h2,.about h2{font-size:clamp(34px,4.2vw,58px);line-height:1.08;max-width:560px}
.head h2{max-width:none}
#newsletter .head{margin-bottom:36px}
#newsletter h2{font-size:clamp(30px,3.6vw,51px)}
.head > p{color:var(--muted);max-width:52ch;margin:28px 0 0;font-size:16px;line-height:1.7}
@media(max-width:860px){.split{grid-template-columns:1fr}}

.mist{background:var(--mist)}

let lang='en';
try{const s=localStorage.getItem('brava-lang');if(s==='es'||s==='en')lang=s;}catch(e){}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const $=id=>document.getElementById(id);

function render(){
  const t=C[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);
  document.querySelectorAll('[data-h]').forEach(el=>el.innerHTML=t[el.dataset.h]);
  const hrefs=['#services','#work','#about'];
  $('links').innerHTML=t.nav.map((n,i)=>`<a href="${hrefs[i]}">${esc(n)}</a>`).join('');
  $('mobile').innerHTML=t.nav.map((n,i)=>`<a href="${hrefs[i]}">${esc(n)}</a>`).join('')+
    `<a href="#" data-switch>${lang==='en'?'Español':'English'}</a><a class="btn btn-solid" href="#contact">${esc(t.call)}</a>`;
  $('lang').innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span class="${lang==='en'?'on':'off'}">EN</span>/<span class="${lang==='es'?'on':'off'}">ES</span>`;
  $('lang').setAttribute('aria-label',lang==='en'?'Cambiar a español':'Switch to English');
  $('problems').innerHTML=t.problems.map(([h,p],i)=>`<div class="row"><span class="n">0${i+1}</span><div><h3 class="pt">${esc(h)}</h3><p>${esc(p)}</p></div></div>`).join('');
  $('wrPoints').innerHTML=t.wrPoints.map(x=>`<li>${esc(x)}</li>`).join('');
  $('svcs').innerHTML=t.services.map(([l,h,p],i)=>`<article class="svc"><div class="top"><span>${esc(l)}</span><span class="num">0${i+1}</span></div><div class="body"><h3>${esc(h)}</h3><p>${esc(p)}</p></div></article>`).join('');
  $('flow').innerHTML=t.flow.map(x=>`<span>${esc(x)}</span>`).join('<i>→</i>');
  $('steps').innerHTML=t.steps.map(([h,sub,p],i)=>`<div class="row"><span class="n" style="font-size:40px">0${i+1}</span><div><h3><em>${esc(h)}</em></h3><p class="st">${esc(sub)}</p><p class="sub">${esc(p)}</p></div></div>`).join('');
  $('pkgs').innerHTML=t.packages.map(([h,m,tag,d,lt,items,time,cta],i)=>`<article class="pkg"><div class="top"><span>${esc(m)}</span><span class="num">0${i+1}</span></div><h3>${esc(h)}</h3><p class="tag">${esc(tag)}</p><p>${esc(d)}</p><p class="lt">${esc(lt)}</p><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="time">${esc(time)}</p><a class="cta" href="#contact">${esc(cta)} ${arrow}</a></article>`).join('');
  $('tools').innerHTML=t.toolGroups.map((g,i)=>`<div><h3>${esc(g)}</h3><div class="chips">${toolItems[i].map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`).join('');
  $('aboutCols').innerHTML=t.about.map(p=>`<p>${esc(p)}</p>`).join('');
  $('why').innerHTML=t.why.map(([b,x])=>`<li><strong>${esc(b)}</strong> ${esc(x)}</li>`).join('');
  $('spend').innerHTML=`<option value="" disabled selected>—</option>`+t.options.map(o=>`<option>${esc(o)}</option>`).join('');
  $('helpWith').innerHTML=`<option value="" disabled selected>—</option>`+t.helpOptions.map(o=>`<option>${esc(o)}</option>`).join('');
  $('status').textContent='';
}
function switchLang(){lang=lang==='en'?'es':'en';try{localStorage.setItem('brava-lang',lang);}catch(e){}render();}
$('lang').addEventListener('click',switchLang);
$('menuBtn').addEventListener('click',()=>{const o=$('mobile').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',o);});
$('mobile').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;if(a.hasAttribute('data-switch')){e.preventDefault();switchLang();}$('mobile').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false');});
$('yr').textContent=new Date().getFullYear();
$('form').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;const t=C[lang];
  $('status').textContent=t.sending;
  try{
    const r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(f)).toString()});
    if(!r.ok)throw new Error();
    f.reset();$('status').textContent='';f.hidden=true;const ty=$('thanks');ty.hidden=false;ty.focus();
  }catch(err){$('status').textContent=t.err;}
});
(function(){
  const b=$('nlBubble'),hero=document.querySelector('.hero'),nl=$('newsletter');
  let closed=false;try{closed=localStorage.getItem('brava-bubble-closed')==='1';}catch(e){}
  if(closed)return;
  b.hidden=false;
  let pastHero=false,atNl=false;
  const upd=()=>b.classList.toggle('show',pastHero&&!atNl);
  new IntersectionObserver(e=>{pastHero=!e[0].isIntersecting;upd();}).observe(hero);
  new IntersectionObserver(e=>{atNl=e[0].isIntersecting;upd();},{threshold:.2}).observe(nl);
  $('nlClose').addEventListener('click',()=>{b.classList.remove('show');setTimeout(()=>b.hidden=true,350);try{localStorage.setItem('brava-bubble-closed','1');}catch(e){}});
  const L=$('nlLink');const sync=()=>{const h=L.getAttribute('href');if(h&&h!=='#'){$('nlBubbleLink').href=h;$('nlBubbleLink').target='_blank';$('nlBubbleLink').rel='noopener';}};sync();
})();
render();
</script>
